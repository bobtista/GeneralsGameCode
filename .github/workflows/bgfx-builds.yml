name: BGFX Builds

run-name: bgfx builds from ${{ inputs.ref || github.ref_name }}

permissions:
  contents: write

on:
  push:
    branches:
      - bobtista/topic/trunk
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag, or SHA to build"
        required: false
        default: "bobtista/topic/trunk"
        type: string
      publish:
        description: "Update the latest-bgfx rolling release"
        required: false
        default: true
        type: boolean

concurrency:
  group: bgfx-builds
  cancel-in-progress: true

env:
  FFMPEG_WIN64_ASSET: ffmpeg-n8.1-latest-win64-gpl-shared-8.1

jobs:
  win64:
    name: ${{ matrix.preset }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - preset: win64
            config: Release
            zip: GeneralsZH-win64
          - preset: win64-debug
            config: Debug
            zip: GeneralsZH-win64-debug
    runs-on: windows-2022
    timeout-minutes: 120
    outputs:
      sha: ${{ steps.sha.outputs.sha }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.ref || github.ref_name }}

      - name: Resolve Built Commit
        id: sha
        shell: pwsh
        run: |
          "sha=$(git rev-parse HEAD)" >> $env:GITHUB_OUTPUT

      - name: Cache FFmpeg
        id: cache-ffmpeg
        uses: actions/cache@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
        with:
          path: .deps-cache/ffmpeg-x64
          key: ffmpeg-win64-${{ env.FFMPEG_WIN64_ASSET }}

      - name: Download FFmpeg
        if: steps.cache-ffmpeg.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $asset = "$env:FFMPEG_WIN64_ASSET.zip"
          Invoke-WebRequest -Uri "https://github.com/BtbN/FFmpeg-Builds/releases/latest/download/$asset" -OutFile ffmpeg.zip
          Expand-Archive -Path ffmpeg.zip -DestinationPath ffmpeg-tmp
          $inner = Get-ChildItem -Directory ffmpeg-tmp | Select-Object -First 1
          New-Item -ItemType Directory -Force -Path .deps-cache | Out-Null
          Move-Item -Path $inner.FullName -Destination .deps-cache/ffmpeg-x64
          Remove-Item ffmpeg.zip

      - name: Set Up VC2022 Environment
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch: x64

      - name: Set Up sccache
        # Single-archive local sccache dir cached as ONE entry per run (not the GHA
        # per-object backend, which fragmented into thousands of tiny cache entries and
        # hit API rate limits -> silent false misses). append-timestamp + restore-key
        # prefix warm-restore each run; max-size bounds it well under the repo cache cap.
        uses: hendrikmuhs/ccache-action@d62db5f07c26379fc4b4e0916f098a92573c3b03 # v1.2.23
        with:
          variant: sccache
          key: bgfx-${{ matrix.preset }}
          max-size: 2G
          verbose: 1

      - name: Cache CMake Dependencies
        uses: actions/cache@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
        with:
          path: build\${{ matrix.preset }}\_deps
          key: cmake-deps-${{ matrix.preset }}-${{ hashFiles('CMakePresets.json','cmake/**/*.cmake','**/CMakeLists.txt') }}
          restore-keys: |
            cmake-deps-${{ matrix.preset }}-

      - name: Configure with CMake
        shell: pwsh
        run: |
          cmake --preset ${{ matrix.preset }} -DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache

      - name: Build GeneralsMD
        shell: pwsh
        run: |
          cmake --build build/${{ matrix.preset }} --config ${{ matrix.config }} --target z_generals
          sccache --show-stats

      - name: Stage and Zip
        shell: pwsh
        run: |
          $build = "build/${{ matrix.preset }}"
          $cfg = "${{ matrix.config }}"
          $stage = New-Item -ItemType Directory -Force -Path "stage"

          Copy-Item "$build/GeneralsMD/$cfg/*.exe" $stage
          if (Test-Path "$build/GeneralsMD/$cfg/*.pdb") {
            Copy-Item "$build/GeneralsMD/$cfg/*.pdb" $stage
          }

          $dlls = Get-ChildItem -Path "$build/_deps" -Recurse -Include "SDL3*.dll","OpenAL32*.dll" |
            Where-Object { $_.FullName -like "*\$cfg\*" }
          if (-not $dlls) {
            throw "No SDL3/OpenAL runtime DLLs found under $build/_deps for config $cfg"
          }
          $dlls | Copy-Item -Destination $stage
          Copy-Item ".deps-cache/ffmpeg-x64/bin/*.dll" $stage

          @(
            "Command & Conquer Generals Zero Hour (GeneralsMD) bgfx build",
            "preset: ${{ matrix.preset }} ($cfg)",
            "ref: ${{ inputs.ref || github.ref_name }}",
            "commit: $(git rev-parse HEAD)",
            "built: $((Get-Date).ToUniversalTime().ToString('o'))"
          ) | Set-Content "$stage/BUILD_INFO.txt"

          # Ship the default render settings (sun shadow map on). The exe-only zip
          # excludes Data\ via the $slim filter below.
          New-Item -ItemType Directory -Force -Path "$stage/Data/INI" | Out-Null
          Copy-Item "scripts/build/dist/Bgfx.ini" "$stage/Data/INI/Bgfx.ini"

          Compress-Archive -Path "$stage/*" -DestinationPath "${{ matrix.zip }}.zip"

          $slim = Get-ChildItem "$stage/*" -Include "*.exe","*.pdb","BUILD_INFO.txt"
          Compress-Archive -Path ($slim | ForEach-Object FullName) -DestinationPath "${{ matrix.zip }}-exe-only.zip"

      - name: Upload Artifact
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: ${{ matrix.zip }}
          path: |
            ${{ matrix.zip }}.zip
            ${{ matrix.zip }}-exe-only.zip
          retention-days: 30
          if-no-files-found: error

  macos:
    name: macos-generalsmd-sdl3-bgfx
    runs-on: macos-15
    timeout-minutes: 120
    env:
      GGC_MACOS_RUNTIME_DIR: ${{ github.workspace }}/stage-macos/GeneralsZH-macos
    steps:
      - name: Checkout Code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.ref || github.ref_name }}

      - name: Install Dependencies
        run: |
          brew install ninja dylibbundler ffmpeg ccache
          command -v pkg-config || brew install pkgconf

      - name: Cache CMake Dependencies
        uses: actions/cache@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
        with:
          path: build/macos-generalsmd-sdl3-bgfx/_deps
          key: cmake-deps-macos-generalsmd-sdl3-bgfx-${{ hashFiles('CMakePresets.json','cmake/**/*.cmake','**/CMakeLists.txt') }}
          restore-keys: |
            cmake-deps-macos-generalsmd-sdl3-bgfx-

      - name: Set Up ccache
        # Single-archive ccache dir, append-timestamp + restore-key prefix so each run
        # saves a fresh entry and warm-restores the latest; max-size caps total size.
        uses: hendrikmuhs/ccache-action@d62db5f07c26379fc4b4e0916f098a92573c3b03 # v1.2.23
        with:
          variant: ccache
          key: bgfx-macos
          max-size: 2G
          verbose: 1

      - name: Configure with CMake
        run: |
          cmake --preset macos-generalsmd-sdl3-bgfx -DRTS_CRASHDUMP_ENABLE=OFF -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build and Stage GeneralsMD
        run: |
          bash scripts/build/macos/build-macos-generalsmd.sh
          ccache -s

      - name: Zip
        run: |
          {
            echo "Command & Conquer Generals Zero Hour (GeneralsMD) bgfx build"
            echo "preset: macos-generalsmd-sdl3-bgfx (Release, arm64)"
            echo "ref: ${{ inputs.ref || github.ref_name }}"
            echo "commit: $(git rev-parse HEAD)"
            echo "built: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > "${GGC_MACOS_RUNTIME_DIR}/BUILD_INFO.txt"
          cd "${GGC_MACOS_RUNTIME_DIR}"
          zip -ry "${GITHUB_WORKSPACE}/GeneralsZH-macos-arm64.zip" .

      - name: Upload Artifact
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: GeneralsZH-macos-arm64
          path: GeneralsZH-macos-arm64.zip
          retention-days: 30
          if-no-files-found: error

  linux:
    name: linux-generalsmd-sdl3-bgfx
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout Code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.ref || github.ref_name }}

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config ccache \
            libx11-dev libxext-dev libxrandr-dev libxi-dev libxcursor-dev \
            libxinerama-dev libxfixes-dev libxrender-dev libxss-dev libxtst-dev \
            libxkbcommon-dev libwayland-dev wayland-protocols libdecor-0-dev \
            libgl1-mesa-dev libegl1-mesa-dev libvulkan-dev \
            libfreetype6-dev libfontconfig1-dev \
            libasound2-dev libpulse-dev \
            nasm curl xz-utils

      - name: Cache CMake Dependencies
        uses: actions/cache@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
        with:
          path: build/linux-generalsmd-sdl3-bgfx/_deps
          key: cmake-deps-linux-generalsmd-sdl3-bgfx-${{ hashFiles('CMakePresets.json','cmake/**/*.cmake','**/CMakeLists.txt') }}
          restore-keys: |
            cmake-deps-linux-generalsmd-sdl3-bgfx-

      - name: Set Up ccache
        uses: hendrikmuhs/ccache-action@d62db5f07c26379fc4b4e0916f098a92573c3b03 # v1.2.23
        with:
          variant: ccache
          key: bgfx-linux
          max-size: 2G
          verbose: 1

      - name: Cache Minimal FFmpeg
        uses: actions/cache@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
        with:
          path: ${{ github.workspace }}/ffmpeg-min
          key: ffmpeg-min-${{ hashFiles('scripts/build/linux/build-ffmpeg-minimal.sh') }}

      - name: Build Minimal FFmpeg
        run: |
          bash scripts/build/linux/build-ffmpeg-minimal.sh "${GITHUB_WORKSPACE}/ffmpeg-min"

      - name: Configure with CMake
        env:
          PKG_CONFIG_PATH: ${{ github.workspace }}/ffmpeg-min/lib/pkgconfig
        run: |
          cmake --preset linux-generalsmd-sdl3-bgfx -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build GeneralsMD
        run: |
          cmake --build build/linux-generalsmd-sdl3-bgfx --config Release --target z_generals -j"$(nproc)"
          ccache -s

      - name: Stage
        run: |
          bash scripts/build/linux/deploy-linux-generalsmd.sh linux-generalsmd-sdl3-bgfx Release
          {
            echo "Command & Conquer Generals Zero Hour (GeneralsMD) bgfx build"
            echo "preset: linux-generalsmd-sdl3-bgfx (Release, x86_64)"
            echo "ref: ${{ inputs.ref || github.ref_name }}"
            echo "commit: $(git rev-parse HEAD)"
            echo "built: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > "${GITHUB_WORKSPACE}/stage-linux/GeneralsZH-linux/BUILD_INFO.txt"

      - name: Zip
        run: |
          cd "${GITHUB_WORKSPACE}/stage-linux/GeneralsZH-linux"
          zip -ry "${GITHUB_WORKSPACE}/GeneralsZH-linux-x64.zip" .

      - name: Upload Artifact
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: GeneralsZH-linux-x64
          path: GeneralsZH-linux-x64.zip
          retention-days: 30
          if-no-files-found: error

  publish:
    name: Update latest-bgfx release
    needs: [win64, macos, linux]
    if: ${{ always() && needs.win64.result == 'success' && needs.macos.result == 'success' && (github.event_name != 'workflow_dispatch' || inputs.publish) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          path: dist
          merge-multiple: true

      - name: Publish Rolling Release
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ needs.win64.outputs.sha }}
          REF: ${{ inputs.ref || github.ref_name }}
        run: |
          cat > notes.md <<EOF
          Latest bgfx builds of Zero Hour (GeneralsMD), automatically updated.

          Built from \`${REF}\` @ ${SHA} on $(date -u +%Y-%m-%d\ %H:%M\ UTC).

          | Asset | Contents |
          | --- | --- |
          | GeneralsZH-win64.zip | Windows x64 Release: generalszh.exe + SDL3/OpenAL/FFmpeg DLLs |
          | GeneralsZH-win64-exe-only.zip | Windows x64 Release: exe only (you already have the DLLs) |
          | GeneralsZH-win64-debug.zip | Windows x64 Debug: exe + PDB + DLLs |
          | GeneralsZH-win64-debug-exe-only.zip | Windows x64 Debug: exe + PDB only |
          | GeneralsZH-macos-arm64.zip | macOS Apple Silicon: generalszh + bundled dylibs + run.sh |
          | GeneralsZH-linux-x64.zip | Linux x86_64: generalszh + bundled libs + run.sh |

          All three builds need the retail Generals + Zero Hour \`.big\` data files (the game assets) from a copy of the game you own. You do NOT need to install the original discs or the old retail Mac release - the \`.big\` files are identical on every platform, so just copy them across from your own existing install (e.g. your Windows or CD install) or wherever you keep your game files.

          Each build ships a default \`Data/INI/Bgfx.ini\` with the sun shadow map enabled (so object shadows render on all backends); delete it for pure engine defaults, or edit it to change render settings.

          Windows setup (GeneralsZH-win64.zip):
          1. Install the VC++ 2022 x64 redistributable.
          2. Unzip it into your Zero Hour folder (next to your \`.big\` files), or unzip anywhere and copy your \`.big\` files in next to \`generalszh.exe\`.
          3. Launch \`generalszh.exe\` (add \`-win\` for windowed).
          4. Optional mod (e.g. Shockwave): put the mod's \`.big\` files in \`Documents\Command and Conquer Generals Zero Hour Data\Shockwave\` and launch with \`-mod Shockwave\`.

          macOS setup (GeneralsZH-macos-arm64.zip - Apple Silicon / M1 or newer only):
          1. \`unzip GeneralsZH-macos-arm64.zip\` - you get a folder with \`generalszh\`, \`run.sh\`, the bundled libraries and \`Data/INI/Bgfx.ini\`. Everything the game needs is bundled inside; no Homebrew or extra installs.
          2. Copy your retail Generals + Zero Hour \`.big\` files into that folder, next to \`generalszh\`.
          3. Clear the Gatekeeper quarantine flag or it will refuse to launch: from inside the folder run \`xattr -dr com.apple.quarantine .\`.
          4. Start it with \`./run.sh -win\`.
          5. Optional mod (e.g. Shockwave): put the mod's \`.big\` files in \`~/Library/Application Support/Command and Conquer Generals Zero Hour Data/Shockwave/\` and launch with \`./run.sh -win -mod Shockwave\`.

          Linux setup (GeneralsZH-linux-x64.zip):
          1. Needs a modern 64-bit distro (glibc 2.38+): Ubuntu 24.04+, Fedora 39+, current Arch, and Steam Deck (SteamOS 3.6+) all work. Older distros will not run it.
          2. Install a Vulkan driver + a couple of runtime libs (SDL3, OpenAL and a stripped FFmpeg are bundled inside the zip). On Ubuntu/Debian: \`sudo apt install libvulkan1 mesa-vulkan-drivers libfreetype6 libfontconfig1\`. On Arch/SteamOS these are already present. Use your GPU vendor's Vulkan driver instead of mesa on NVIDIA; package names vary by distro.
          3. \`unzip GeneralsZH-linux-x64.zip\`, then run \`./import-from-wine.sh\` from the unzipped folder. It locates an existing WINE / Proton / Steam / Lutris install on its own - including Steam on Debian / Ubuntu / Mint and libraries on a second drive - and copies the \`.big\` archives plus the loose \`Data\` folders next to \`generalszh\`. Add \`--with-saves\` to bring your options and saved games across as well, or \`--prefix /path/to/game\` if your install lives somewhere unusual.
          4. Start the game with \`./run.sh -win\`.
             - Copying by hand instead? Take every \`.big\` file **and** the install's loose \`Data\` folder: the skirmish / multiplayer scripts, the mouse cursors and the videos are not inside the \`.big\` archives, and skirmish AI misbehaves without them.
             - Own it on Steam and happy to play in place? \`unzip\` straight into your Zero Hour folder and run \`./run.sh -win\` from there - the engine reads \`ZH_Generals/\` for the base Generals assets by itself, so nothing needs copying at all.
          5. Optional mod (e.g. Shockwave): put the mod's \`.big\` files in \`~/.local/share/Command and Conquer Generals Zero Hour Data/Shockwave/\` and launch with \`./run.sh -win -mod Shockwave\`.
          EOF

          gh release delete latest-bgfx --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes || true
          gh release create latest-bgfx dist/*.zip \
            --repo "$GITHUB_REPOSITORY" \
            --target "$SHA" \
            --prerelease \
            --title "Latest bgfx builds" \
            --notes-file notes.md
