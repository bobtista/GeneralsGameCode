name: GO bgfx Builds

run-name: GeneralsOnline bgfx builds from ${{ inputs.ref || github.ref_name }}

permissions:
  contents: write

on:
  push:
    branches:
      - bobtista/go/mac-bgfx
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag, or SHA to build"
        required: false
        default: "bobtista/go/mac-bgfx"
        type: string
      publish:
        description: "Update the latest-go-bgfx rolling release"
        required: false
        default: true
        type: boolean

concurrency:
  group: go-bgfx-builds
  cancel-in-progress: true

jobs:
  win32:
    name: win32-go-bgfx
    runs-on: windows-2022
    timeout-minutes: 240
    outputs:
      sha: ${{ steps.sha.outputs.sha }}
    env:
      BUILD_DIR: build/go-win32
      # GameNetworkingSockets crashes on lobby join when linked statically into this build,
      # so ship the dependencies as DLLs.
      TRIPLET: x86-windows
    steps:
      - name: Checkout Code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.ref || github.ref_name }}

      - name: Resolve Built Commit
        id: sha
        shell: pwsh
        run: |
          "sha=$(git rev-parse HEAD)" >> $env:GITHUB_OUTPUT

      - name: Set Up VC2022 Environment
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch: x86

      - name: Cache vcpkg Binaries
        uses: actions/cache@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
        with:
          path: ${{ github.workspace }}\vcpkg-bincache
          key: go-vcpkg-${{ runner.os }}-${{ env.TRIPLET }}-${{ hashFiles('vcpkg.json', 'triplets/*.cmake') }}
          restore-keys: |
            go-vcpkg-${{ runner.os }}-${{ env.TRIPLET }}-

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@5e0cab206a5ea620130caf672fce3e4a6b5666a1 # v11.5
        with:
          runVcpkgInstall: false
          doNotCache: true
          vcpkgJsonGlob: vcpkg.json

      - name: Configure vcpkg Binary Cache
        shell: pwsh
        run: |
          $cacheDir = "${{ github.workspace }}\vcpkg-bincache"
          New-Item -ItemType Directory -Force -Path $cacheDir | Out-Null
          "VCPKG_DEFAULT_BINARY_CACHE=$cacheDir" >> $env:GITHUB_ENV
          "VCPKG_BINARY_SOURCES=clear;files,$cacheDir,readwrite" >> $env:GITHUB_ENV
          "VCPKG_OVERLAY_TRIPLETS=${{ github.workspace }}\triplets" >> $env:GITHUB_ENV

      - name: Cache CMake Dependencies
        uses: actions/cache@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
        with:
          path: ${{ env.BUILD_DIR }}/_deps
          key: go-cmake-deps-win32-${{ hashFiles('CMakePresets.json','cmake/**/*.cmake','**/CMakeLists.txt') }}
          restore-keys: |
            go-cmake-deps-win32-

      - name: Configure with CMake
        shell: pwsh
        run: |
          $lib = "${{ github.workspace }}/${{ env.BUILD_DIR }}/vcpkg_installed/${{ env.TRIPLET }}/lib"
          cmake --preset win32-vcpkg -B ${{ env.BUILD_DIR }} `
            -DVCPKG_TARGET_TRIPLET=${{ env.TRIPLET }} `
            -DGGC_RENDER_BACKEND=bgfx -DSAGE_USE_SDL3=ON -DSAGE_USE_OPENAL=ON `
            -DRTS_BUILD_GENERALS=OFF -DRTS_BUILD_GENERALS_TOOLS=OFF -DRTS_BUILD_ZEROHOUR_TOOLS=OFF -DRTS_BUILD_CORE_TOOLS=OFF `
            "-DFFMPEG_AVCODEC_LIBRARY=$lib/avcodec.lib" `
            "-DFFMPEG_AVFORMAT_LIBRARY=$lib/avformat.lib" `
            "-DFFMPEG_AVUTIL_LIBRARY=$lib/avutil.lib" `
            "-DFFMPEG_SWSCALE_LIBRARY=$lib/swscale.lib;$lib/swresample.lib"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build GeneralsMD
        shell: pwsh
        run: |
          cmake --build ${{ env.BUILD_DIR }} --config Release --target z_generals
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Stage and Zip
        shell: pwsh
        run: |
          $out = "${{ env.BUILD_DIR }}/GeneralsMD/Release"
          $stage = New-Item -ItemType Directory -Force -Path "stage/GeneralsOnline-bgfx"

          if (-not (Test-Path "$out/GeneralsOnlineZH.exe")) {
            throw "GeneralsOnlineZH.exe was not produced in $out"
          }
          Copy-Item "$out/GeneralsOnlineZH.exe" $stage
          Copy-Item "$out/*.dll" $stage
          if (Test-Path "$out/crashpad_handler.exe") { Copy-Item "$out/crashpad_handler.exe" $stage }

          foreach ($name in "SDL3.dll", "OpenAL32.dll", "binkw32.dll") {
            $dll = Get-ChildItem -Path "${{ env.BUILD_DIR }}/_deps" -Recurse -Filter $name |
              Where-Object { $_.FullName -like "*\Release\*" } | Select-Object -First 1
            if (-not $dll) { throw "Runtime DLL $name not found under ${{ env.BUILD_DIR }}/_deps" }
            Copy-Item $dll.FullName $stage
          }

          foreach ($name in "GameNetworkingSockets.dll", "libprotobuf.dll", "libssl-3.dll", "libcrypto-3.dll", "libcurl.dll", "sentry.dll") {
            if (-not (Test-Path "$stage/$name")) { throw "Expected runtime DLL $name is missing from the package" }
          }

          Copy-Item "scripts/build/dist/go/Play GeneralsOnline bgfx.bat" $stage
          Copy-Item "scripts/build/dist/go/Diagnose GeneralsOnline bgfx.bat" $stage
          Copy-Item "scripts/build/dist/go/diagnose.ps1" $stage
          Copy-Item "scripts/build/dist/go/README-windows.txt" "$stage/README.txt"
          Copy-Item "LICENSE.md" $stage
          @(
            "GeneralsOnline bgfx build (unofficial)",
            "platform: Windows x86 (32-bit), Release",
            "ref: ${{ inputs.ref || github.ref_name }}",
            "commit: $(git rev-parse HEAD)",
            "built: $((Get-Date).ToUniversalTime().ToString('o'))"
          ) | Set-Content "$stage/BUILD_INFO.txt"

          Compress-Archive -Path $stage.FullName -DestinationPath "GeneralsOnline-bgfx-win32.zip"

      - name: Upload Artifact
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: GeneralsOnline-bgfx-win32
          path: GeneralsOnline-bgfx-win32.zip
          retention-days: 30
          if-no-files-found: error

  macos:
    name: macos-go-bgfx
    runs-on: macos-15
    timeout-minutes: 240
    env:
      GGC_MACOS_RUNTIME_DIR: ${{ github.workspace }}/stage-macos/GeneralsOnline-bgfx-macos-arm64
      VCPKG_ROOT: ${{ github.workspace }}/vcpkg
      VCPKG_INSTALLED: ${{ github.workspace }}/vcpkg-installed
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/vcpkg-bincache
    steps:
      - name: Checkout Code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.ref || github.ref_name }}

      - name: Install Dependencies
        run: |
          brew install ninja dylibbundler ffmpeg ccache jq
          command -v pkg-config || brew install pkgconf

      - name: Cache vcpkg Binaries
        uses: actions/cache@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
        with:
          path: ${{ github.workspace }}/vcpkg-bincache
          key: go-vcpkg-macos-arm64-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            go-vcpkg-macos-arm64-

      - name: Install vcpkg Dependencies
        # FFmpeg comes from Homebrew and stb from FetchContent on macOS, so they are dropped
        # from the manifest. The rest (GameNetworkingSockets, curl, sentry) come from vcpkg.
        run: |
          baseline=$(jq -r '."builtin-baseline"' vcpkg.json)
          git clone https://github.com/microsoft/vcpkg.git "$VCPKG_ROOT"
          git -C "$VCPKG_ROOT" checkout "$baseline"
          "$VCPKG_ROOT/bootstrap-vcpkg.sh" -disableMetrics
          mkdir -p "$VCPKG_DEFAULT_BINARY_CACHE" "$RUNNER_TEMP/go-manifest"
          jq '.dependencies |= map(select((type == "string" and (. == "ffmpeg" or . == "stb")) | not))' vcpkg.json > "$RUNNER_TEMP/go-manifest/vcpkg.json"
          "$VCPKG_ROOT/vcpkg" install --triplet arm64-osx \
            --x-manifest-root="$RUNNER_TEMP/go-manifest" \
            --x-install-root="$VCPKG_INSTALLED"

      - name: Cache CMake Dependencies
        uses: actions/cache@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
        with:
          path: build/macos-generalsmd-sdl3-bgfx/_deps
          key: go-cmake-deps-macos-${{ hashFiles('CMakePresets.json','cmake/**/*.cmake','**/CMakeLists.txt') }}
          restore-keys: |
            go-cmake-deps-macos-

      - name: Set Up ccache
        uses: hendrikmuhs/ccache-action@d62db5f07c26379fc4b4e0916f098a92573c3b03 # v1.2.23
        with:
          variant: ccache
          key: go-bgfx-macos
          max-size: 2G

      - name: Configure with CMake
        run: |
          cmake --preset macos-generalsmd-sdl3-bgfx \
            -DCMAKE_PREFIX_PATH="$VCPKG_INSTALLED/arm64-osx" \
            -DRTS_CRASHDUMP_ENABLE=OFF \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build and Stage GeneralsMD
        run: |
          bash scripts/build/macos/build-macos-generalsmd.sh
          ccache -s

      - name: Zip
        run: |
          {
            echo "GeneralsOnline bgfx build (unofficial)"
            echo "platform: macOS Apple Silicon (arm64), Release"
            echo "ref: ${{ inputs.ref || github.ref_name }}"
            echo "commit: $(git rev-parse HEAD)"
            echo "built: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > "${GGC_MACOS_RUNTIME_DIR}/BUILD_INFO.txt"
          cd "$(dirname "${GGC_MACOS_RUNTIME_DIR}")"
          zip -ry "${GITHUB_WORKSPACE}/GeneralsOnline-bgfx-macos-arm64.zip" "$(basename "${GGC_MACOS_RUNTIME_DIR}")"

      - name: Upload Artifact
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: GeneralsOnline-bgfx-macos-arm64
          path: GeneralsOnline-bgfx-macos-arm64.zip
          retention-days: 30
          if-no-files-found: error

  publish:
    name: Update latest-go-bgfx release
    needs: [win32, macos]
    if: ${{ always() && needs.win32.result == 'success' && (github.event_name != 'workflow_dispatch' || inputs.publish) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          path: dist
          merge-multiple: true

      - name: Publish Rolling Release
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ needs.win32.outputs.sha }}
          REF: ${{ inputs.ref || github.ref_name }}
        run: |
          (
            cd dist
            LC_ALL=C sha256sum *.zip > SHA256SUMS.txt
          )

          cat > notes.md <<EOF
          Unofficial GeneralsOnline client builds with the bgfx renderer, automatically updated. Not made or supported by the GeneralsOnline team.

          Built from \`${REF}\` @ ${SHA} on $(date -u +%Y-%m-%d\ %H:%M\ UTC).

          | Asset | Contents |
          | --- | --- |
          | GeneralsOnline-bgfx-win32.zip | Windows 32-bit: a GeneralsOnline-bgfx folder to extract inside your Zero Hour folder, then run "Play GeneralsOnline bgfx.bat". See README.txt inside. |
          | GeneralsOnline-bgfx-macos-arm64.zip | macOS Apple Silicon: generalszh + bundled dylibs + run.sh |
          | SHA256SUMS.txt | SHA-256 checksums |

          Keep \`Data\\INI\\GameData.ini\` stock, or GeneralsOnline lobbies reject the join for modified INI files.
          EOF

          gh release delete latest-go-bgfx --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes || true
          gh release create latest-go-bgfx dist/*.zip dist/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --target "$SHA" \
            --prerelease \
            --title "GeneralsOnline bgfx builds (unofficial, latest)" \
            --notes-file notes.md
