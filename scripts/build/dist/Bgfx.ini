; Optional bgfx render settings. Loaded after GameData.ini, client render only
; (not part of the INI CRC). All keys are optional; omitted keys use the engine
; defaults shown below. -bgfxEffects / -bgfxNoEffects on the command line
; override the ShadowMaps / DynamicLightShadows / RimLight / EmissiveBoost keys.
;
; Shipped default: the modern sun shadow map is enabled and the classic stencil
; volume shadows are disabled, so object shadows render correctly on every
; backend (Metal / D3D11 / Vulkan). Delete this file to fall back to pure engine
; defaults, or edit the keys below to taste.
GameData

  ; --- Renderer / quality ---
  ; BgfxRenderer =                    ; default auto (Metal on macOS, D3D11 on Windows, Vulkan on Linux)
  ; BgfxMSAA = 4                      ; valid: 1, 2, 4, 8, 16
  ; BgfxRenderScale = 1.0             ; 3D scene resolution scale
  ; BgfxSrgb = No
  ; BgfxPointFilter = No              ; nearest-neighbor texture filtering

  ; --- Post-processing composite (sharpen / saturation / contrast / FXAA) ---
  ; BgfxPostProcessing = Yes
  ; BgfxPostSharpenAmount = 0.08
  ; BgfxPostSaturation = 1.015
  ; BgfxPostContrast = 1.01
  ; BgfxPostFxaaAmount = 0.35
  ; BgfxNoPostFx = No                 ; skip the post-fx pass entirely
  ; BgfxNoSceneFramebuffer = No       ; render directly to backbuffer (disables all post)

  ; --- HDR / bloom ---
  ; BgfxHdr = No                      ; RGBA16F targets + ACES tonemap; pairs with bloom
  ; BgfxBloom = No
  ; BgfxBloomThreshold = 0.7
  ; BgfxBloomIntensity = 0.5

  ; --- Color grade ---
  ; BgfxColorGrade = No
  ; BgfxColorGradeStrength = 1.0
  ; BgfxColorGradeTemperature = 0.0   ; -1..1 cold..warm
  ; BgfxColorGradeTint = 0.0          ; -1..1 green..magenta

  ; --- Vignette / chromatic aberration / film grain ---
  ; BgfxVignette = No
  ; BgfxVignetteStrength = 0.4
  ; BgfxChromaticAberration = No
  ; BgfxChromaticAberrationAmount = 0.5
  ; BgfxFilmGrain = No
  ; BgfxFilmGrainStrength = 0.08

  ; --- SSAO ---
  ; BgfxSSAO = No
  ; BgfxSSAORadius = 12.0             ; world units; camera is far, small radii don't read
  ; BgfxSSAOIntensity = 1.0

  ; --- Lighting effects ---
  ; BgfxSpecular = No
  ; BgfxSpecularStrength = 3.0
  ; BgfxRimLight = No
  ; BgfxRimStrength = 0.3
  ; BgfxRimPower = 3.0
  ; BgfxEmissiveBoost = No
  ; BgfxEmissiveBoostScale = 2.0

  ; --- Shadows ---
  BgfxShadowMaps = Yes                ; sun shadow map (default No)
  ; BgfxShadowMapBias = 0.0006
  ; BgfxShadowMapStrength = 0.35
  ; BgfxShadowFullPcf = No
  BgfxStencilShadows = No             ; classic volume shadows (default Yes)
  ; BgfxDynamicLightShadows = No      ; nuke / particle-cannon lights

  ; --- Particles ---
  ; BgfxSoftParticles = No
  ; BgfxSoftParticleFadeScale = 80.0

  ; --- A/B comparison wipe ---
  ; BgfxWipeEnabled = No
  ; BgfxWipeFollowMouse = Yes
  ; BgfxWipeSplit = 0.5

  ; --- Debug ---
  ; BgfxLogStats = No

End
